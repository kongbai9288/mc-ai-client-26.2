name: Build MCAI

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: 解析最新 Loom 版本
        run: |
          LOOM=$(curl -sSL https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml \
            | grep -o '<version>[^<]*</version>' | tail -1 | sed 's/<\/*version>//g')
          echo "loom=$LOOM"
          sed -i "s/^loom_version=.*/loom_version=$LOOM/" gradle.properties
          cat gradle.properties

      - name: 准备 Gradle
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.0-bin.zip
          mkdir -p "$RUNNER_TEMP/gdist"
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP/gdist"
          echo "$RUNNER_TEMP/gdist/gradle-9.7.0/bin" >> $GITHUB_PATH
          gradle --version

      - name: 构建
        run: |
          gradle build --stacktrace 2>&1 | tail -60

      - name: 列出产物
        run: |
          ls -lh build/libs/ 2>/dev/null || echo "无产物"
          find build -name "*.jar" 2>/dev/null

      - name: 发布 jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          JAR=$(find build/libs -name "*.jar" ! -name "*sources*" | head -1)
          if [ -z "$JAR" ]; then echo "未找到 jar"; exit 1; fi
          echo "jar=$JAR"
          ls -lh "$JAR"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$JAR" \
            --title "MCAI (MC 26.2)" --notes "自动构建：${{ github.sha }}"

      - name: 上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/
